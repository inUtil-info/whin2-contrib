<script type="text/x-red" data-help-name="whin-send">
    <p>Send messages to your registered WhatsApp account through the Whin API</p>

    <h3>Quick Start</h3>
    <ol>
        <li>Configure your Whin API credentials in the Authentication field</li>
        <li>Connect the node to your flow and deploy</li>
        <li>Send a message with the appropriate payload format</li>
    </ol>

    <h3>Message Types</h3>
    <p>You can send different types of messages by configuring the <code>msg.payload</code>:</p>
    
    <h4>Text Message</h4>
    <pre>
{
    "text": "Hello, this is a test message"
}</pre>

    <h4>Location</h4>
    <pre>
{
    "location": {
        "latitude": 40.7128,
        "longitude": -74.0060,
        "name": "New York City"
    }
}</pre>

    <h4>Image with Caption</h4>
    <pre>
{
    "image": {
        "url": "https://example.com/image.jpg",
        "caption": "Image description"
    }
}</pre>

    <h4>Video</h4>
    <pre>
{
    "video": {
        "url": "https://example.com/video.mp4",
        "caption": "Video description"
    }
}</pre>

    <h4>Audio</h4>
    <pre>
{
    "audio": {
        "url": "https://example.com/audio.mp3"
    }
}</pre>

    <h4>Document</h4>
    <pre>
{
    "document": {
        "url": "https://example.com/document.pdf",
        "filename": "document.pdf"
    }
}</pre>

    <h3>Response Format</h3>
    <p>The node will output a response object containing:</p>
    <pre>
{
    "status": "success",
    "messageId": "3EB0C767D94B8B33",
    "timestamp": 1234567890
}</pre>

    <h3>Error Handling</h3>
    <p>The node will show errors in the following cases:</p>
    <ul>
        <li>Missing or invalid authentication configuration</li>
        <li>Invalid message payload format</li>
        <li>API request failures</li>
    </ul>

    <h3>Best Practices</h3>
    <ul>
        <li>Use HTTPS URLs for media files</li>
        <li>Keep text messages under 4096 characters</li>
        <li>Handle API rate limits in your flow</li>
        <li>Use appropriate message types for your content</li>
    </ul>

    <h3>Example Flow</h3>
    <pre>
[{"id":"send-node","type":"whin-send"}]
[{"id":"inject","type":"inject","payload":{"text":"Hello!"}}]</pre>
</script>
